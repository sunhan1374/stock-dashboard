<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>서난이가 만든 증시 대시보드</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--card:#fff;--fg:#1b1f27;--mut:#6b7280;--line:#e5e7eb;--up:#e5383b;--down:#1d6fdc;--acc:#2f4bd8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#181d26;--fg:#e8eaf0;--mut:#8b93a3;--line:#2a3140;--up:#ff6b6b;--down:#5aa2ff;--acc:#7b93ff}}
:root[data-theme="dark"]{--bg:#0f1218;--card:#181d26;--fg:#e8eaf0;--mut:#8b93a3;--line:#2a3140;--up:#ff6b6b;--down:#5aa2ff;--acc:#7b93ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
.sub{color:var(--mut);font-size:13px}
.badge{font-size:11px;background:var(--line);color:var(--mut);padding:2px 8px;border-radius:99px}
h2{font-size:16px;margin:24px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.idx .n{font-size:13px;color:var(--mut)}
.idx .v{font-size:22px;font-weight:700}
.up{color:var(--up)}.down{color:var(--down)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:15px}
button{padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer;font-size:14px}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chips{margin:8px 0;display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:4px 10px;font-size:12px;border-radius:99px}
.head{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 4px;flex-wrap:wrap;gap:6px}
.px{font-size:24px;font-weight:700}
#chart{position:relative}
svg{width:100%;height:auto;display:block;touch-action:none}
#tip{position:absolute;top:4px;left:8px;font-size:12px;color:var(--mut);background:var(--card);padding:2px 6px;border-radius:6px;pointer-events:none}
.news{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.news ol{margin:0;padding:0;list-style:none}
.news li{padding:10px 0;border-bottom:1px solid var(--line)}
.news li:last-child{border:0}
.news b{display:block;font-size:14px}
.news span{font-size:12px;color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>📈 서난이가 만든 증시 대시보드</h1><div class="sub" id="today"></div></div>
  <span class="badge" id="mode">연결 중…</span>
</header>

<h2>주요 지수</h2>
<div class="grid" id="indices"></div>

<h2>종목 차트</h2>
<div class="card">
  <div class="row">
    <input id="q" list="names" placeholder="종목명 입력 (예: 삼성전자, 엔비디아)" autocomplete="off">
    <button id="go" class="on">조회</button>
  </div>
  <datalist id="names"></datalist>
  <div class="chips" id="chips"></div>
  <div class="head"><div><span id="sn" style="font-weight:600"></span> <span class="sub" id="sm"></span></div><div><span class="px" id="sp"></span> <span id="sc"></span></div></div>
  <div class="row" id="per">
    <button data-d="30">1개월</button><button data-d="90" class="on">3개월</button><button data-d="250">1년</button>
  </div>
  <div id="chart"><div id="tip"></div><svg id="svg" viewBox="0 0 700 280" preserveAspectRatio="none"></svg></div>
</div>

<h2>오늘의 증시 영향 뉴스 TOP 3</h2>
<div class="news">
  <div class="card"><b>🇰🇷 국내</b><ol id="nkr"></ol></div>
  <div class="card"><b>🇺🇸 해외</b><ol id="nus"></ol></div>
</div>

<p class="note">※ 지수·차트는 Yahoo Finance(비공식), 뉴스는 네이버·Google News에서 후보를 모은 뒤 AI가 증시 영향도를 기준으로 3건을 고른 것이며 오판할 수 있습니다. 투자 참고용이며 매매 기능은 제공하지 않습니다.</p>
</div>

<script>
const $=id=>document.getElementById(id);
const fmt=(n,d=2)=>n.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const cls=c=>c>=0?'up':'down',sg=c=>(c>=0?'▲ +':'▼ ')+fmt(c)+'%';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(v,c)=>c==='KRW'?'₩'+fmt(v,0):c==='USD'?'$'+fmt(v):fmt(v)+' '+(c||'');
async function api(p){const r=await fetch(p);if(!r.ok)throw new Error(r.status);return r.json()}
$('today').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'})+' 기준';

// 서버(/api) 미연결 시 보여줄 샘플
const S_IDX=[{n:'KOSPI',v:2650.12,c:0.85},{n:'S&P 500',v:5500.3,c:-0.32},{n:'NASDAQ',v:17200.55,c:0.41},{n:'다우존스',v:40100.1,c:-0.12}];
const S_NEWS={kr:[1,2,3].map(i=>({t:'(샘플) 국내 증시 뉴스 '+i,s:'서버 연결 시 실제 뉴스 표시'})),us:[1,2,3].map(i=>({t:'(샘플) 해외 증시 뉴스 '+i,s:'서버 연결 시 실제 뉴스 표시'}))};
const SUG=['삼성전자','SK하이닉스','NAVER','카카오','애플','엔비디아','테슬라','마이크로소프트'];
$('names').innerHTML=SUG.map(k=>`<option value="${k}">`).join('');
$('chips').innerHTML=SUG.slice(0,6).map(k=>`<button data-n="${k}">${k}</button>`).join('');

const renderIdx=a=>$('indices').innerHTML=a.map(i=>`<div class="card idx"><div class="n">${esc(i.n)}</div><div class="v">${fmt(i.v)}</div><div class="${cls(i.c)}">${sg(i.c)}</div></div>`).join('');
const nl=a=>a.map(x=>`<li><b>${x.u?`<a href="${esc(x.u)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${esc(x.t)}</a>`:esc(x.t)}</b><span>${esc(x.s)}</span>${x.why?`<span style="display:block;margin-top:2px;color:var(--fg)">💡 ${esc(x.why)}</span>`:''}</li>`).join('');
const renderNews=n=>{$('nkr').innerHTML=nl(n.kr);$('nus').innerHTML=nl(n.us)};

async function init(){
  let live=true;
  try{renderIdx(await api('/api/indices'))}catch(e){live=false;renderIdx(S_IDX)}
  try{renderNews(await api('/api/news'))}catch(e){renderNews(S_NEWS)}
  $('mode').textContent=live?'실시간 데이터':'샘플 모드 · 서버 미연결';
}

function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
function series(name,base,n){let r=hash(name),p=base*0.9,a=[];
 for(let i=0;i<n;i++){r=(r*1664525+1013904223)>>>0;p*=1+((r/4294967296)-0.48)*0.03;a.push(p)}
 const k=base/a[n-1];return a.map(x=>x*k)}

let cur='삼성전자',days=90,seq=0;
async function draw(){
  const id=++seq;let o;
  $('sm').textContent='불러오는 중…';
  try{o=await api(`/api/chart?q=${encodeURIComponent(cur)}&days=${days}`)}
  catch(e){
    if(e.message==='404'){if(id===seq){$('sn').textContent=cur;$('sm').textContent='종목을 찾지 못했어요';}return}
    o={name:cur,symbol:'샘플 데이터',cur:'KRW',c:series(cur,(hash(cur)%90+10)*1000,250).slice(-days)};
  }
  if(id!==seq)return;
  const d=o.c,W=700,H=280,pad=12,mn=Math.min(...d),mx=Math.max(...d);
  const X=i=>i/(d.length-1)*W,Y=v=>H-pad-(v-mn)/(mx-mn||1)*(H-2*pad);
  const chg=(d[d.length-1]/d[0]-1)*100,col=chg>=0?'var(--up)':'var(--down)';
  const pts=d.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  $('svg').innerHTML=`<polygon points="0,${H} ${pts} ${W},${H}" fill="${col}" opacity=".08"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/><line id="cl" y1="0" y2="${H}" stroke="var(--mut)" stroke-dasharray="3" opacity="0"/>`;
  $('sn').textContent=o.name;$('sm').textContent=o.symbol;
  $('sp').textContent=money(d[d.length-1],o.cur);$('sc').className=cls(chg);$('sc').textContent=sg(chg)+' (기간)';
  $('tip').textContent='차트 위에 마우스/터치';
  const mv=e=>{const b=$('svg').getBoundingClientRect(),i=Math.max(0,Math.min(d.length-1,Math.round((e.clientX-b.left)/b.width*(d.length-1))));
    const l=$('cl');l.setAttribute('x1',X(i));l.setAttribute('x2',X(i));l.setAttribute('opacity',1);
    const dt=o.t?new Date(o.t[i]*1000):new Date(Date.now()-(d.length-1-i)*864e5);
    $('tip').textContent=dt.toLocaleDateString('ko-KR')+'  '+money(d[i],o.cur)};
  $('svg').onpointermove=mv;$('svg').onpointerdown=mv;
}
function pick(n){n=n.trim();if(!n)return;cur=n;$('q').value=n;draw()}
$('go').onclick=()=>pick($('q').value);
$('q').onkeydown=e=>{if(e.key==='Enter')pick($('q').value)};
$('chips').onclick=e=>{if(e.target.dataset.n)pick(e.target.dataset.n)};
$('per').onclick=e=>{const d=e.target.dataset.d;if(!d)return;days=+d;[...$('per').children].forEach(b=>b.classList.toggle('on',b===e.target));draw()};
init();draw();
</script>
</body>
</html>
